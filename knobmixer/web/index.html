<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knob Mixer</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root {
    --bg: #050505; --text: #e8e8ea; --muted-text: #9a9aa2; --track: #2a2c33;
    --knob-edge: #5d6370; --knob-face: #3a3f4a; --knob-core: #2b2f38; --danger: #ef4d5a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 "Segoe UI", system-ui, sans-serif; user-select: none; overflow: hidden; }
  main { display: flex; flex-direction: column; height: 100%; padding: 18px 16px 12px; }
  .row { flex: 1; display: flex; flex-wrap: wrap; justify-content: space-around; align-items: center; gap: 8px; }
  .channel { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 150px; }
  svg { width: 130px; height: 130px; cursor: ns-resize; touch-action: none; }
  .track, .value { fill: none; stroke-width: 9; stroke-linecap: round; }
  .track { stroke: var(--track); }
  .value { transition: stroke-dasharray 90ms linear, stroke 150ms; }
  .pointer { stroke: #fff; stroke-width: 6; stroke-linecap: round; transition: transform 90ms linear; }
  .name { font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .pct { color: var(--muted-text); font-variant-numeric: tabular-nums; height: 1.4em; }
  .channel.muted .value { stroke: #4a4d55 !important; }
  .channel.muted .pointer { stroke: #8a8d95; }
  .channel.muted .pct { color: var(--danger); font-weight: 600; }
  .channel.off { opacity: .35; }
  .channel.off svg { cursor: default; }
  footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--muted-text); font-size: 12px; }
  #status.bad { color: var(--danger); }
  a.gear { color: var(--muted-text); text-decoration: none; padding: 2px 6px; border-radius: 6px; }
  a.gear:hover { color: var(--text); background: #1a1b20; }
</style>
</head>
<body>
<main>
  <div class="row" id="row"></div>
  <footer>
    <span id="status">Connecting…</span>
    <span>Scroll / drag = volume · Click = mute &nbsp; <a class="gear" href="/settings">⚙ Settings</a></span>
  </footer>
</main>
<script>
// 270° arc from 7:30 to 4:30 o'clock, r=80 around (100,100)
const ARC = "M 43.43 156.57 A 80 80 0 1 1 156.57 156.57";
let els = {}, layout = "", dragging = null, step = 0.02;

function build(knobs) {
  const row = document.getElementById("row");
  row.innerHTML = "";
  els = {};
  for (const k of knobs) {
    const div = document.createElement("div");
    div.className = "channel";
    div.innerHTML = `
      <svg viewBox="0 0 200 200">
        <defs><radialGradient id="g-${k.id}" cx="40%" cy="35%" r="70%">
          <stop offset="0" stop-color="var(--knob-face)"/><stop offset="1" stop-color="var(--knob-core)"/>
        </radialGradient></defs>
        <path class="track" d="${ARC}" pathLength="100"/>
        <path class="value" d="${ARC}" pathLength="100" stroke="${k.color}" stroke-dasharray="0 100"/>
        <circle cx="100" cy="100" r="64" fill="var(--knob-edge)"/>
        <circle cx="100" cy="100" r="58" fill="url(#g-${k.id})"/>
        <line class="pointer" x1="100" y1="54" x2="100" y2="74" style="transform-origin:100px 100px"/>
      </svg>
      <div class="name"></div>
      <div class="pct">–</div>`;
    div.querySelector(".name").textContent = k.label;
    div.querySelector("svg").setAttribute("aria-label", `${k.label} volume`);
    row.appendChild(div);
    els[k.id] = { div, value: div.querySelector(".value"), pointer: div.querySelector(".pointer"),
                  pct: div.querySelector(".pct"), svg: div.querySelector("svg"), vol: 0, available: true };
    wire(k.id);
  }
}

function render(id, vol, muted, available = true) {
  const e = els[id];
  e.vol = vol; e.available = available;
  e.value.setAttribute("stroke-dasharray", `${(vol * 100).toFixed(2)} 100`);
  e.pointer.style.transform = `rotate(${-135 + 270 * vol}deg)`;
  e.div.classList.toggle("muted", available && muted);
  e.div.classList.toggle("off", !available);
  e.pct.textContent = !available ? "unavailable" : muted ? "MUTED" : `${Math.round(vol * 100)}%`;
}

function apply(s) {
  if (s.navigate && s.navigate !== location.pathname) return location.assign(s.navigate);
  const sig = JSON.stringify(s.knobs.map(k => [k.id, k.label, k.color]));
  if (sig !== layout) { layout = sig; build(s.knobs); }
  step = s.step;
  const st = document.getElementById("status");
  st.textContent = s.connected ? "Connected" : `Audio unavailable — ${s.error}`;
  st.classList.toggle("bad", !s.connected);
  for (const k of s.knobs) if (dragging !== k.id) render(k.id, k.volume, k.muted, k.available);
}

async function post(q) {
  try { apply(await (await fetch(`/api/knob?${q}`, { method: "POST" })).json()); } catch {}
}

// Coalesce drag updates: at most one request in flight, always send the latest value.
const pendingSet = {}, inflight = {};
async function sendSet(id, v) {
  pendingSet[id] = v;
  if (inflight[id]) return;
  inflight[id] = true;
  while (pendingSet[id] !== undefined) {
    const val = pendingSet[id]; delete pendingSet[id];
    await post(`id=${id}&action=set&amount=${val}`);
  }
  inflight[id] = false;
}

function wire(id) {
  const e = els[id];
  e.svg.addEventListener("wheel", ev => {
    ev.preventDefault();
    if (!e.available) return;
    const up = ev.deltaY < 0;
    render(id, Math.min(1, Math.max(0, e.vol + (up ? step : -step))), e.div.classList.contains("muted"));
    post(`id=${id}&action=${up ? "up" : "down"}`);
  }, { passive: false });

  e.svg.addEventListener("pointerdown", ev => {
    if (!e.available) return;
    e.svg.setPointerCapture(ev.pointerId);
    const startY = ev.clientY, startVol = e.vol;
    let moved = false;
    dragging = id;
    const move = mv => {
      const dy = startY - mv.clientY;
      if (Math.abs(dy) > 3) moved = true;
      if (!moved) return;
      const v = Math.min(1, Math.max(0, startVol + dy / 200));
      render(id, v, e.div.classList.contains("muted"));
      sendSet(id, v.toFixed(3));
    };
    const up = () => {
      e.svg.removeEventListener("pointermove", move);
      e.svg.removeEventListener("pointerup", up);
      dragging = null;
      if (!moved) post(`id=${id}&action=mute`);
    };
    e.svg.addEventListener("pointermove", move);
    e.svg.addEventListener("pointerup", up);
  });
}

async function poll() {
  try { apply(await (await fetch("/api/state")).json()); }
  catch {
    const st = document.getElementById("status");
    st.textContent = "Knob Mixer is not running"; st.classList.add("bad");
  }
  setTimeout(poll, 200);
}
poll();
</script>
</body>
</html>
